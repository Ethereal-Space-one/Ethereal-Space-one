<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-labelledby="title desc">
  <title id="title">Context Almanac</title>
  <desc id="desc">An editorial illustration. Two notes from separate agent sessions are tied to a project record, with the source of a decision still attached.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fbfaf6"/><stop offset="1" stop-color="#f0eee6"/>
    </linearGradient>
    <linearGradient id="note" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fdfbf7"/><stop offset="1" stop-color="#f5f3ec"/>
    </linearGradient>
    <clipPath id="page"><rect x="1" y="1" width="958" height="304" rx="16"/></clipPath>
  </defs>
  <rect x="1" y="1" width="958" height="304" rx="16" fill="url(#paper)" stroke="#d4d0c6"/>
  <g clip-path="url(#page)">
    <g stroke="#48627e" fill="none" stroke-linecap="round">
      <path opacity=".10" d="M397 309C448 272 469 212 547 190S688 186 718 145S750 66 815 45S910 33 960 2"/>
      <path opacity=".18" d="M410 313C461 276 482 216 560 194S701 190 731 149S763 70 828 49S923 37 973 6"/>
      <path opacity=".24" d="M423 317C474 280 495 220 573 198S714 194 744 153S776 74 841 53S936 41 986 10"/>
      <path opacity=".12" d="M436 321C487 284 508 224 586 202S727 198 757 157S789 78 854 57S949 45 999 14"/>
    </g>
    <path d="M47 50h29m-29 172h334" fill="none" stroke="#b9b3a8"/>
    <rect x="82" y="47" width="6" height="6" fill="#914531"/>
    <text x="100" y="55" fill="#5c625d" font-family="Georgia, serif" font-size="12" letter-spacing="1.4">03 / CONTEXT ALMANAC</text>
    <g fill="#202e36" font-family="Georgia, Liberation Serif, serif" font-size="31" letter-spacing="-.65">
      <text x="46" y="124">A new session.</text>
      <text x="46" y="162">The same project.</text>
    </g>
    <text x="47" y="250" fill="#525a55" font-family="Georgia, serif" font-size="12.5" letter-spacing=".28">Keep the decision, the next step, and the source.</text>
    <g transform="translate(-38 0) rotate(-7 763 126)">
      <rect x="720" y="47" width="151" height="166" rx="10" fill="#e4e3db" opacity=".7"/>
      <rect x="716" y="43" width="151" height="166" rx="10" fill="url(#note)" stroke="#bac3bf"/>
      <text x="732" y="68" font-family="monospace" font-size="10" letter-spacing="1.35" fill="#516779">SESSION 01</text>
      <path d="M732 82h108m-108 11h83m-83 12h101m-101 12h64" fill="none" stroke="#acb6b6" stroke-opacity=".55" stroke-linecap="round"/>
    </g>
    <g transform="translate(28 0) rotate(6 809 130)">
      <rect x="741" y="54" width="156" height="164" rx="10" fill="#deded5" opacity=".67"/>
      <rect x="737" y="50" width="156" height="164" rx="10" fill="url(#note)" stroke="#b6c0c0"/>
      <text x="766" y="75" font-family="monospace" font-size="10" letter-spacing="1.35" fill="#516779">SESSION 02</text>
      <path d="M767 90h99m-99 12h74m-74 12h92m-92 12h62" fill="none" stroke="#acb6b6" stroke-opacity=".52" stroke-linecap="round"/>
    </g>
    <rect x="521" y="91" width="277" height="111" rx="11" fill="#d8dedb" opacity=".50"/>
    <rect x="518" y="87" width="277" height="111" rx="11" fill="#fbfaf5" stroke="#a9b9bf"/>
    <text x="537" y="112" font-family="monospace" font-size="10" letter-spacing="1.35" fill="#4e6779">PROJECT MEMORY</text>
    <text x="537" y="141" font-family="Georgia, serif" font-size="20" fill="#253641">Decision and next step</text>
    <path d="M537 155h208" fill="none" stroke="#d3d8d4"/>
    <text x="537" y="177" font-family="monospace" font-size="10.5" fill="#4f6068">SOURCE: SESSION 01</text>
    <path d="M704 68C758 76 799 123 783 161S799 215 846 225" fill="none" stroke="#425f78" stroke-width="1.65" stroke-linecap="round"/>
    <circle cx="704" cy="68" r="3" fill="#f8f6ef" stroke="#425f78"/>
    <circle cx="783" cy="161" r="3" fill="#f8f6ef" stroke="#425f78"/>
    <rect x="678" y="224" width="227" height="36" rx="8" fill="#f8f7f0" stroke="#adbdc0"/>
    <text x="694" y="246" font-family="monospace" font-size="10" letter-spacing="1.35" fill="#4d636e">ORIGINAL SOURCE ATTACHED</text>
    <circle cx="882" cy="242" r="2.5" fill="#914531"/>
  </g>
</svg>
